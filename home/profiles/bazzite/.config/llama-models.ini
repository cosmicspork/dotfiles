; Router presets for llama-server (--models-preset).
;
; Section names are model ids exactly as the router reports them in GET /models;
; keys are llama-server arguments with the leading dashes stripped. Restart the
; service after editing:
;   systemctl --user restart llama-server.service
;
; Host, port, API key, and model alias are owned by the router and are stripped
; from presets on load -- set those in llama-server.env instead.
version = 1

; Shared by every model unless a section overrides the key.
[*]
n-gpu-layers = 99
flash-attn = on
jinja = true

; Qwen3-Coder-Next: 80B total / 3B active, ~49.6 GB at UD-Q4_K_XL. Requires the
; 64 GiB GTT pool (amdgpu.gttsize / ttm.pages_limit kargs) -- it does not fit in
; the kernel default of half of RAM. Measured on a HX 370 / 890M via Vulkan at
; 49/49 layers offloaded: ~57 t/s prompt, ~15 t/s generation at 4K context.
;
; Long context on gfx1150 is not fully proven: llama.cpp #24861 reports a
; CPU-side Vulkan hang between 8K and 16K depth on this chip. If generation
; stalls at depth, drop ctx-size and retest before assuming a model problem.
; Section name is the id the router derives from the cached file, which drops
; the "UD-" prefix of Qwen3-Coder-Next-UD-Q4_K_XL.gguf -- confirm against
; GET /models before renaming, or the preset silently defines a new model
; instead of configuring the cached one.
[unsloth/Qwen3-Coder-Next-GGUF:Q4_K_XL]
ctx-size = 65536
temp = 0.7
top-p = 0.8
top-k = 20
repeat-penalty = 1.05
