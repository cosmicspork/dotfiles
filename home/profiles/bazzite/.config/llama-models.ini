; Router presets for llama-server (--models-preset).
;
; Section names are model ids exactly as the router reports them in GET /models;
; keys are llama-server arguments with the leading dashes stripped. Restart the
; service after editing:
;   systemctl --user restart llama-server.service
;
; Host, port, API key, and model alias are owned by the router and are stripped
; from presets on load -- set those in llama-server.env instead.
version = 1

; Shared by every model unless a section overrides the key.
[*]
n-gpu-layers = 99
flash-attn = on
jinja = true

; Qwen3-Coder-Next: 80B total / 3B active, ~49.6 GB at UD-Q4_K_XL. Requires the
; 64 GiB GTT pool (amdgpu.gttsize / ttm.pages_limit kargs) -- it does not fit in
; the kernel default of half of RAM. Measured on a HX 370 / 890M via Vulkan at
; 49/49 layers offloaded: ~57 t/s prompt, ~15 t/s generation at 4K context.
;
; llama.cpp #24861 (CPU-side Vulkan hang between 8K and 16K depth on gfx1150)
; does not reproduce on b10362: probed 2026-08-12 at d8192 = 16.39 t/s and
; d16384 = 15.73 t/s, both clean. Held at 65536 anyway -- nothing above 16K has
; been measured for this model, and it is the daily driver.
;
; Section name is the id the router derives from the cached file, which drops
; the "UD-" prefix of Qwen3-Coder-Next-UD-Q4_K_XL.gguf -- confirm against
; GET /models before renaming, or the preset silently defines a new model
; instead of configuring the cached one.
[unsloth/Qwen3-Coder-Next-GGUF:Q4_K_XL]
ctx-size = 65536
temp = 0.7
top-p = 0.8
top-k = 20
repeat-penalty = 1.05

; Muse Glimmer 30B: dense, so every parameter is read per token -- unlike the
; MoE above, which activates 3B of 80B. Smaller on disk and slower to run:
; measured 72.95 t/s prompt, 3.95 t/s generation (pp512/tg128, 18.29 GiB, fa on).
; Prompt processing beats Qwen's ~57 t/s; generation is ~4x slower than its ~15.
; It is a reasoning model -- a small max_tokens returns an empty content field
; because the whole budget goes to the reasoning trace.
; mmproj-kquant.gguf sits beside it in the cache and is picked up automatically,
; which is why the router reports this model as text+image.
;
; Sampling is Meta's recommendation (temp 1.0 / top-p 0.95 / top-k 64), not the
; conservative values used for Qwen.
;
; ctx-size is the model's full trained 131072. It is nearly free here: loading at
; that context measured 21 GB against 19.6 GB of weights, so KV plus compute
; buffers cost ~1.4 GB -- the 2048-token sliding window on the local-attention
; layers keeps the cache flat rather than scaling with context. Depth probed
; 2026-08-12 clean to d32768 (3.78 t/s, vs 3.83 at d0); 32K-131K is unmeasured.
[meta-models/Muse-Glimmer-30B-GGUF:DYNAMIC]
ctx-size = 131072
temp = 1.0
top-p = 0.95
top-k = 64
